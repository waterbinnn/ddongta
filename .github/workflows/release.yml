# Every push to main is a release: tag it and publish a GitHub Release listing
# the commits since the last one. Render deploys main on its own.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          # notes: one line per commit since the last release (we push straight to main, so there are no PRs)
          {
            echo "## 바뀐 것"
            git log --no-merges --format='- %s' ${prev:+$prev..}HEAD
            [ -n "$prev" ] && echo && echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prev...$tag"
          } > notes.md
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag · $(date -u +%Y-%m-%d)" \
            --notes-file notes.md

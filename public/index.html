<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>똥타 · 온라인 뒷간</title>
  <meta name="description" content="다같이 들어와서, 각자 칸에 앉아서 똥 싸고, 같이 떠드는 온라인 뒷간">
  <meta name="theme-color" content="#f2d98a">
  <!-- link previews (KakaoTalk, Slack, X, iMessage...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="똥타">
  <meta property="og:title" content="똥타 · 온라인 뒷간">
  <meta property="og:description" content="다같이 들어와서, 각자 칸에 앉아 볼일 보며 떠드는 온라인 뒷간">
  <meta property="og:url" content="https://ddongta.onrender.com/">
  <meta property="og:image" content="https://ddongta.onrender.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="노란 체크 타일 화장실 입구 너머로 분수와 칸들이 보이는 픽셀아트 화면과 똥타 로고">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="똥타 · 온라인 뒷간">
  <meta name="twitter:description" content="다같이 들어와서, 각자 칸에 앉아 볼일 보며 떠드는 온라인 뒷간">
  <meta name="twitter:image" content="https://ddongta.onrender.com/og.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💩</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene" id="scene"></div>
  <div class="labels" id="labels"></div>

  <header class="top">
    <div class="chip status">
      <span class="item"><span id="peopleIcon"></span><span id="online">문 여는 중</span></span>
      <span class="sep"></span>
      <span class="item"><span id="todayIcon"></span>오늘 <b id="todayCount">0</b></span>
    </div>
    <div class="right">
      <button class="chip sound" id="soundBtn" type="button" aria-label="소리 켜기"></button>
    </div>
  </header>

  <div class="chip badge" id="queue" hidden></div>
  <div class="chip toast" id="toast" hidden></div>

  <div class="feed" id="feed" aria-live="polite"></div>

  <div class="joy" id="joy" aria-hidden="true"><div class="knob"></div></div>

  <div class="dock">
    <div class="push-pad" id="pushPad"></div>
    <nav class="actions" id="actions"></nav>
    <form class="chat" id="chatBox">
      <input id="chatInput" maxlength="80" placeholder="칸 너머로 한마디..." autocomplete="off" enterkeyhint="send">
      <button type="submit" aria-label="보내기">↵</button>
    </form>
    <div class="keys" id="hint">
      <span><kbd>←↑↓→</kbd> 걷기</span>
      <span><kbd>Space</kbd> 앉기·힘주기·노크</span>
      <span><kbd>J</kbd> 점프</span>
      <span><kbd>B</kbd> 에티켓벨</span>
      <span><kbd>Esc</kbd> 나가기</span>
      <span><kbd>Enter</kbd> 대화</span>
      <span>드래그 회전 · 휠 확대</span>
    </div>
  </div>

  <div class="loading" id="loading">휴지 채우는 중...</div>

  <div class="down" id="down" role="alert" hidden>
    <div class="down-card">
      <div class="down-ico" id="downIcon"></div>
      <b>서버가 터졌어요!</b>
      <p>조치 중이니 잠시만 기다려 주세요.<br>다시 연결되면 바로 들어가져요.</p>
      <span class="down-retry">다시 연결하는 중<i>.</i><i>.</i><i>.</i></span>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

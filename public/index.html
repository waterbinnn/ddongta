<body>
  <div class="scene" id="scene"></div>
  <div class="labels" id="labels"></div>
  <div class="wish-link" id="wishLink" hidden>황금똥 · 문지르고 소원 빌기</div>
  <div class="bean-label" id="beanLabel" hidden></div>

  <header class="top">
    <div class="chip status">
      <span class="item"><span id="peopleIcon"></span><span id="online">문 여는 중</span></span>
      <span class="sep"></span>
      <span class="item"><span id="busyIcon"></span><span id="busy">0칸</span></span>
      <span class="sep"></span>
      <span class="item"><span id="todayIcon"></span><span class="today-word">오늘</span><b id="todayCount">0</b></span>
    </div>
    <div class="right">
      <button class="chip sound" id="recenterBtn" type="button" aria-label="내 시점으로" title="내 시점으로 (R)"></button>
      <button class="chip sound" id="soundBtn" type="button" aria-label="소리 설정" aria-haspopup="true" aria-expanded="false"></button>
      <div class="sound-menu" id="soundMenu" role="menu" hidden>
        <button type="button" role="menuitemradio" data-mode="fx"></button>
        <button type="button" role="menuitemradio" data-mode="all"></button>
        <button type="button" role="menuitemradio" data-mode="off"></button>
      </div>
    </div>
  </header>

  <div class="move-wrap">
    <button class="chip move-chip" id="moveBtn" type="button" aria-haspopup="true"></button>
    <div class="sound-menu move-menu" id="moveMenu" role="menu" hidden></div>
  </div>

  <div class="chip toast" id="toast" hidden></div>
  <div class="place-name" id="placeName" aria-live="polite"></div>


  <div class="joy" id="joy" aria-hidden="true"><div class="knob"></div></div>

  <!-- what you carry or can do anywhere it applies (a drink, 줍기, 도시락 …), always on the same key -->
  <nav class="rail" id="rail"></nav>
  <!-- phones: the rail's small buttons fold away behind this one, and open up above it on a tap -->
  <button class="rail-toggle" id="railToggle" type="button" aria-label="행동 펼치기" aria-expanded="false" hidden></button>

  <div class="dock">
    <div class="push-pad" id="pushPad"></div>
    <nav class="actions" id="actions"></nav>
    <form class="chat" id="chatBox">
      <input id="chatInput" maxlength="80" placeholder="황금똥에게 소원 빌기…" autocomplete="off" enterkeyhint="send">
      <button type="submit" aria-label="보내기">↵</button>
    </form>
    </div>
  </div>

  <div class="fade" id="fade"></div>

  <div class="loading" id="loading">

      <span class="loading-grunt">끙…</span>

  <div class="down" id="down" role="alert" hidden>
    <div class="down-card">
      <div class="down-ico" id="downIcon"></div>
      <b>서버가 터졌어요!</b>
      <p>조치 중이니 잠시만 기다려 주세요.<br>다시 연결되면 바로 들어가져요.</p>
      <span class="down-retry">다시 연결하는 중<i>.</i><i>.</i><i>.</i></span>
    </div>
  </div>

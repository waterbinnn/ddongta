<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>황금똥 소원 · 똥타</title>
  <meta name="description" content="다 같이 문질러서 닳아 가는 황금똥. 문지르면서 소원을 빌어 보세요.">
  <meta name="theme-color" content="#120d07">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="똥타">
  <meta property="og:title" content="황금똥에 소원 빌기">
  <meta property="og:description" content="다 같이 문질러서 닳아 가는 황금똥. 문지르면서 소원을 빌어 보세요.">
  <meta property="og:url" content="https://ddongta.com/wish">
  <meta property="og:image" content="https://ddongta.com/og.png">
  <meta property="og:locale" content="ko_KR">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💩</text></svg>">
  <link rel="stylesheet" href="wish.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/jsm/" } }</script>
</head>
<body>
  <div class="scene" id="scene"></div>
  <div class="floats" id="floats" aria-live="polite"></div>

  <header class="top">
    <a class="chip back" href="/">← 화장실로</a>
    <button class="chip snd" id="sndBtn" type="button" aria-label="소리 끄기"></button>
  </header>

  <p class="notice" id="notice" hidden></p>
  <p class="hint" id="hint">황금똥을 문질러 소원을 빌어 보세요</p>

  <div class="bottom">
    <p class="count"><b id="lap">이번 바퀴 0번</b><span class="dot">·</span><span id="mine">모두 0번</span></p>
    <p class="meta"><span id="today">오늘 0번 문질러졌어요</span><span class="dot">·</span><span id="online">연결하는 중</span></p>
    <form class="wish-form" id="wishForm" autocomplete="off">
      <input id="wishInput" maxlength="40" placeholder="소원 한 줄 띄우기 (선택)" enterkeyhint="send">
      <button type="submit">띄우기</button>
    </form>
  </div>

  <script type="module" src="wish.js"></script>
</body>
</html>

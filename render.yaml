# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
# Day-to-day work goes to develop; only main is deployed (each push to main is also a GitHub Release).
services:
  - type: web
    name: ddongta
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      # keeps "today's poops" across restarts and deploys
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ddongta-kv
          property: connectionString

  # a small free Key Value store, reachable only from the web service
  - type: keyvalue
    name: ddongta-kv
    plan: free
    ipAllowList: []
